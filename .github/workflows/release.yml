name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-version:
    name: Verify tag matches app version
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # 保证 GitHub Release 的 tag 版本 = 二进制内嵌版本（package.json / tauri.conf.json /
      # Cargo.toml / Cargo.lock / site/src/config.ts 五处一致），不一致直接失败
      - name: Verify version consistency
        run: node scripts/sync-version.mjs --check "$GITHUB_REF_NAME"

  build-windows:
    name: Build Windows (x64)
    needs: [check-version]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # openssl vendored 在 Windows 上需要 Strawberry Perl 与 NASM
      - name: Install Strawberry Perl and NASM
        shell: pwsh
        run: choco install strawberryperl nasm -y --no-progress

      - name: Install frontend dependencies
        run: npm ci

      - name: Build (NSIS installer)
        run: npm run tauri build -- --bundles nsis

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  build-macos:
    name: Build macOS (${{ matrix.target }})
    needs: [check-version]
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build (app + dmg)
        run: npm run tauri build -- --bundles app,dmg --target ${{ matrix.target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error

  build-linux:
    name: Build Linux (x64)
    needs: [check-version]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            build-essential curl wget file \
            libxdo-dev libssl-dev \
            patchelf \
            libfuse2 \
            rpm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build (deb + AppImage + rpm)
        run: npm run tauri build -- --bundles deb,appimage,rpm

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-x64
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [build-windows, build-macos, build-linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: "TopSSL 免费证书助手 ${{ github.ref_name }}"
          generate_release_notes: true
          files: artifacts/**
          fail_on_unmatched_files: true

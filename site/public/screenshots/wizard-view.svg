<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" font-family="'Microsoft YaHei','PingFang SC','Segoe UI',sans-serif">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3cc5e2"/><stop offset="1" stop-color="#0085a1"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="800" fill="#f8fafb"/>
  <rect width="216" height="800" fill="#ffffff"/>
  <rect x="215.5" width="0.5" height="800" fill="#e4eaee"/>
  <rect x="24" y="24" width="36" height="36" rx="9" fill="url(#brand)"/>
  <path d="M33 37.5V32a5.25 5.25 0 1 0-10.5 0v5.5m-0.9 6h12.3a2.63 2.63 0 0 0 2.62-2.62V30.6a2.63 2.63 0 0 0-2.63-2.63H27.6a2.63 2.63 0 0 0-2.63 2.63v10.28a2.63 2.63 0 0 0 2.63 2.62Z" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="70" y="38" font-size="14.5" font-weight="700" fill="#0f172a">TopSSL</text>
  <text x="70" y="56" font-size="12.5" font-weight="700" fill="#0f172a">免费证书助手</text>
  <g font-size="13" font-weight="500">
    <rect x="14" y="96" width="188" height="34" rx="8" fill="#f1f5f9"/>
    <rect x="28" y="106" width="16" height="16" rx="3" fill="none" stroke="#64748b" stroke-width="1.5"/>
    <text x="54" y="118" fill="#334155">我的证书</text>
    <rect x="14" y="138" width="188" height="34" rx="8" fill="#eef7fa"/>
    <rect x="28" y="148" width="16" height="16" rx="3" fill="none" stroke="#0085a1" stroke-width="1.5"/>
    <text x="54" y="160" fill="#036b81">申请证书</text>
    <g fill="#64748b">
      <rect x="28" y="182" width="16" height="16" rx="3" fill="none" stroke="#64748b" stroke-width="1.5"/>
      <text x="54" y="194">DNS 配置</text>
      <rect x="28" y="218" width="16" height="16" rx="3" fill="none" stroke="#64748b" stroke-width="1.5"/>
      <text x="54" y="230">设置</text>
      <rect x="28" y="254" width="16" height="16" rx="3" fill="none" stroke="#64748b" stroke-width="1.5"/>
      <text x="54" y="266">应用日志</text>
      <rect x="28" y="290" width="16" height="16" rx="3" fill="none" stroke="#64748b" stroke-width="1.5"/>
      <text x="54" y="302">关于</text>
    </g>
  </g>
  <!-- 步骤条 -->
  <g font-size="12" font-weight="500">
    <circle cx="288" cy="52" r="13" fill="#0085a1"/>
    <text x="288" y="57" font-size="12" fill="#fff" text-anchor="middle" font-weight="700">1</text>
    <text x="316" y="57" fill="#0085a1" font-weight="700">域名</text>
    <rect x="400" y="49" width="120" height="2" fill="#0085a1"/>
    <circle cx="550" cy="52" r="13" fill="#e2e8f0"/>
    <text x="550" y="57" font-size="12" fill="#64748b" text-anchor="middle" font-weight="700">2</text>
    <text x="578" y="57" fill="#64748b">验证方式</text>
    <rect x="662" y="49" width="120" height="2" fill="#e2e8f0"/>
    <circle cx="812" cy="52" r="13" fill="#e2e8f0"/>
    <text x="812" y="57" font-size="12" fill="#64748b" text-anchor="middle" font-weight="700">3</text>
    <text x="840" y="57" fill="#64748b">确认信息</text>
    <rect x="924" y="49" width="120" height="2" fill="#e2e8f0"/>
    <circle cx="1074" cy="52" r="13" fill="#e2e8f0"/>
    <text x="1074" y="57" font-size="12" fill="#64748b" text-anchor="middle" font-weight="700">4</text>
    <text x="1102" y="57" fill="#64748b">申请中</text>
  </g>
  <!-- 表单卡片 -->
  <rect x="252" y="88" width="900" height="672" rx="16" fill="#fff" stroke="#e4eaee"/>
  <text x="288" y="132" font-size="15" font-weight="700" fill="#0f172a">填写域名</text>
  <text x="288" y="154" font-size="12" fill="#64748b">支持单域名、多域名（SAN）与通配符证书</text>
  <text x="288" y="188" font-size="12.5" font-weight="600" fill="#334155">主域名 <tspan fill="#ef4444">*</tspan></text>
  <rect x="288" y="200" width="828" height="42" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="304" y="226" font-size="13" fill="#94a3b8" font-family="'Consolas','Courier New',monospace">www.example.com 或 *.example.com</text>
  <text x="288" y="268" font-size="12.5" font-weight="600" fill="#334155">其他域名（可选，多域名证书）</text>
  <rect x="288" y="280" width="828" height="42" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="304" y="306" font-size="13" fill="#94a3b8" font-family="'Consolas','Courier New',monospace">api.example.com（每行一个）</text>
  <text x="288" y="348" font-size="12.5" font-weight="600" fill="#334155">验证方式</text>
  <rect x="288" y="360" width="404" height="112" rx="12" fill="#eef7fa" stroke="#0085a1" stroke-width="1.5"/>
  <circle cx="312" cy="386" r="8" fill="#0085a1"/><circle cx="312" cy="386" r="3" fill="#fff"/>
  <text x="334" y="390" font-size="13" font-weight="600" fill="#0f172a">HTTP 验证（推荐）</text>
  <text x="334" y="412" font-size="11.5" fill="#64748b">自动在 80 端口临时开启验证服务</text>
  <text x="334" y="430" font-size="11.5" fill="#64748b">无需任何额外配置</text>
  <rect x="712" y="360" width="404" height="112" rx="12" fill="#fff" stroke="#e2e8f0"/>
  <circle cx="736" cy="386" r="8" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="758" y="390" font-size="13" font-weight="600" fill="#0f172a">DNS 验证</text>
  <text x="758" y="412" font-size="11.5" fill="#64748b">调用 DNS 服务商 API 自动添加 TXT 记录</text>
  <text x="758" y="430" font-size="11.5" fill="#64748b">支持通配符证书</text>
  <text x="288" y="502" font-size="12.5" font-weight="600" fill="#334155">申请环境</text>
  <rect x="288" y="514" width="404" height="52" rx="10" fill="#fff" stroke="#e2e8f0"/>
  <circle cx="312" cy="540" r="8" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="334" y="536" font-size="12.5" font-weight="600" fill="#334155">测试环境</text>
  <text x="334" y="554" font-size="11" fill="#94a3b8">Staging，不消耗正式配额</text>
  <rect x="712" y="514" width="404" height="52" rx="10" fill="#eef7fa" stroke="#0085a1" stroke-width="1.5"/>
  <circle cx="736" cy="540" r="8" fill="#0085a1"/><circle cx="736" cy="540" r="3" fill="#fff"/>
  <text x="758" y="536" font-size="12.5" font-weight="600" fill="#0f172a">正式环境</text>
  <text x="758" y="554" font-size="11" fill="#94a3b8">浏览器信任，注意速率限制</text>
  <!-- 底部按钮 -->
  <rect x="288" y="596" width="828" height="44" rx="10" fill="#0085a1"/>
  <text x="702" y="624" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">下一步：选择验证方式</text>
  <text x="288" y="668" font-size="11" fill="#94a3b8">申请全程约 1-3 分钟 · 证书有效期 90 天 · 到期前 30 天自动续期</text>

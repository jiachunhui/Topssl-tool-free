  <text x="276" y="726" font-size="12.5" font-weight="600" fill="#036b81">💡 提示</text>
  <text x="276" y="746" font-size="11.5" fill="#475569">证书到期前 30 天会自动续期，请保持应用在系统托盘运行（建议开启开机自启）</text>
